appId: ${APP_ID}
name: 15 · a batch spanning two folders asks for one grant, not two
tags:
  - core
---
# The files come from the fixture root and from `bulk/` inside it. Android's
# `ACTION_OPEN_DOCUMENT_TREE` can only grant a real folder, so the obvious
# implementation asks once per distinct source folder — and marches the user
# through a picker for every subfolder of a job that was meant to be one tap.
#
# `OutputPlanner._grantFor` instead accepts any *existing* grant that covers the
# folder or an ancestor of it, returning the nested path as `subPath`. One grant
# on `LatchE2E` therefore covers `LatchE2E/bulk`, and the second file needs no
# prompt at all. Both containers still land in their own source folder.
#
# The order is load-bearing: `two-a.txt` is picked first so the grant is taken
# on the ancestor. Picking the nested file first would grant `bulk/` and leave
# the top-level file uncovered — a different (and correctly prompting) case.
- launchApp
- runFlow: ../subflows/ensure_home.yaml

- tapOn:
    id: "home_encrypt"
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/pick_file.yaml
    env:
      FILE: ${TWO_A}
      PICK_ROOT: internal
      PICK_SUBDIR: ""
- extendedWaitUntil:
    visible:
      id: "encrypt_pick_add"
    timeout: 15000
- runFlow:
    file: ../subflows/pick_file.yaml
    env:
      FILE: ${BULK_FILE}
      PICK_ROOT: internal
      PICK_SUBDIR: ${BULK_SUBDIR}
- assertVisible: "2 files selected"
- tapOn:
    id: "encrypt_pick_continue"
- waitForAnimationToEnd
- tapOn: "Enter passphrase"
- inputText: "${PASS}"
- tapOn:
    id: "encrypt_passphrase_continue"
- waitForAnimationToEnd
- tapOn:
    id: "encrypt_options_continue"
- waitForAnimationToEnd
- tapOn:
    id: "encrypt_review_lock"

# Exactly one grant. A second prompt would leave this flow waiting here — the
# `save_grant` subflow is run once, and nothing else answers a dialog.
- runFlow: ../subflows/save_grant.yaml

- extendedWaitUntil:
    visible:
      id: "encrypt_success_done"
    timeout: 60000
- assertVisible: "2 files locked."
# Two folders, two destinations — the screen must not claim a single one.
- assertVisible: ".*Saved across 2 folders.*"
- assertNotVisible: ".*saved to your Downloads folder.*"
- tapOn:
    id: "encrypt_success_done"
