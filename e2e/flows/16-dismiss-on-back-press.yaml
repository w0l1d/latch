appId: ${APP_ID}
name: 16 · dismissing the destination dialog writes nothing
tags:
  - core
---
# Flow 10 answers the destination question with its Cancel *button*. The other
# way to leave a dialog on Android is the back gesture, and `showDialog` then
# completes with `null`. That null used to be read as "Use Downloads" — the same
# conflation the button Cancel was fixed for — so the gesture needs its own
# test, not an assumption that it takes the button's path.
#
# Both dialogs are `barrierDismissible: false`; that stops a stray tap outside
# the dialog from answering, and back still means "I did not decide".
- launchApp
- runFlow: ../subflows/ensure_home.yaml

- tapOn:
    id: "home_encrypt"
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/pick_file.yaml
    env:
      FILE: ${CANCEL_FILE}
      PICK_ROOT: internal
      PICK_SUBDIR: ""
- tapOn:
    id: "encrypt_pick_continue"
- waitForAnimationToEnd
- tapOn: "Enter passphrase"
- inputText: "${PASS}"
- tapOn:
    id: "encrypt_passphrase_continue"
- waitForAnimationToEnd
- tapOn:
    id: "encrypt_options_continue"
- waitForAnimationToEnd
- tapOn:
    id: "encrypt_review_lock"

# Rationale answered normally, so the destination dialog is what back reaches.
- extendedWaitUntil:
    visible:
      id: "save_folder_rationale_continue"
    timeout: 20000
- tapOn:
    id: "save_folder_rationale_cancel"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*Where to save.*"
    timeout: 20000
- back
- waitForAnimationToEnd

# A dismiss is the absence of an answer: the batch stops, the way Cancel does.
- extendedWaitUntil:
    visible:
      id: "encrypt_review_lock"
    timeout: 15000
- assertNotVisible:
    id: "encrypt_success_done"
