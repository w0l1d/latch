name: Feature request
description: Suggest a change or an addition.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Latch is deliberately narrow: offline, stateless, no account, no recovery.
        Ideas that need a server, an account, or a way to recover a forgotten
        passphrase cannot be accepted — they would change what the app is.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Alternatives you considered are welcome.

  - type: textarea
    id: constraints
    attributes:
      label: Does this touch the container format?
      description: >
        If it changes a byte of the `.latch` layout, it needs a new format
        version and a compatibility story. Say so if you think it does.
