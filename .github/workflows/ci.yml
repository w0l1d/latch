name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + test (app, core, adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Pub get myenc_core
        run: flutter pub get
        working-directory: packages/myenc_core

      - name: Pub get myenc_adapters
        run: flutter pub get
        working-directory: packages/myenc_adapters

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze app
        run: flutter analyze --no-pub

      - name: Analyze myenc_core
        run: flutter analyze --no-pub
        working-directory: packages/myenc_core

      - name: Analyze myenc_adapters
        run: flutter analyze --no-pub
        working-directory: packages/myenc_adapters

      - name: Test myenc_core
        run: flutter test
        working-directory: packages/myenc_core

      # sodium 4.x loads libsodium via Dart native assets — flutter test
      # builds/bundles it automatically; no apt install needed.
      - name: Test myenc_adapters (real libsodium + golden vectors)
        id: crypto_test
        run: flutter test
        working-directory: packages/myenc_adapters

      - name: Test app
        run: flutter test

      - name: Alert on crypto/golden-vector regression
        if: failure() && steps.crypto_test.outcome == 'failure' && github.event_name == 'push'
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          MESSAGE=$'🚨 *Latch — crypto regression*\n\nmyenc_adapters golden-vector tests failed on `'"${SHORT_SHA}"$'`.\n\n🔗 [Run]('"${RUN_URL}"$')'
          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"-1003694191301\", \"message_thread_id\": 53, \"text\": $(echo "$MESSAGE" | jq -Rs .), \"parse_mode\": \"Markdown\", \"disable_web_page_preview\": true}" \
            "https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendMessage")
          echo "$RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::error::Telegram sendMessage failed: $RESPONSE"
            exit 1
          fi

  # The Android SAF plumbing is plain Kotlin the Dart tests can't reach. The
  # path ↔ document-id mapping it rests on decides whether output lands beside
  # the original and whether the folder picker opens at the source folder — both
  # silent when wrong — so its JVM unit tests gate merges too.
  android-unit-test:
    name: Unit test (Android/Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      # Resolves the plugin projects Gradle includes, and writes the
      # local.properties that android/settings.gradle.kts requires.
      - name: Pub get
        run: flutter pub get

      - name: Point Gradle at the Flutter SDK
        run: echo "flutter.sdk=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")" > android/local.properties

      - name: Gradle unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: android

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/
          retention-days: 7
