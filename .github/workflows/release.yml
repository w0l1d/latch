name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*-*'
  workflow_dispatch:

jobs:
  # Auto-tags pushes to main (and manual runs) with the next vYYYY.MM.DD-N
  # tag, bumping pubspec.yaml's version to match and committing that bump
  # so the tagged commit's code carries the exact version being released.
  # Direct tag pushes (e.g. `git push origin vYYYY.MM.DD-N`) skip this and
  # go straight to build_and_release, which validates pubspec.yaml against
  # the tag either way.
  auto_tag:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next tag and bump pubspec.yaml
        id: tag
        run: |
          git fetch --tags -q

          EXISTING_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$' | head -1 || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "HEAD already tagged: $EXISTING_TAG"
            echo "tag_name=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_DATE="$(date -u +'%Y.%m.%d')"

          LATEST_BUILD=$(git tag --list 'v*.*.*-*' \
            | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$' \
            | sed -E 's/^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-([0-9]+)$/\1/' \
            | sort -n | tail -1)
          if [ -z "$LATEST_BUILD" ]; then
            NEW_BUILD=1
          else
            NEW_BUILD=$((LATEST_BUILD + 1))
          fi

          NEW_TAG="v${CURRENT_DATE}-${NEW_BUILD}"

          if ! [[ "$NEW_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$ ]]; then
            echo "::error::Computed tag '$NEW_TAG' does not match required format vYYYY.MM.DD-N"
            exit 1
          fi

          sed -i -E "s/^version: .*/version: ${CURRENT_DATE}+${NEW_BUILD}/" pubspec.yaml
          grep -q "^version: ${CURRENT_DATE}+${NEW_BUILD}$" pubspec.yaml || {
            echo "::error::Failed to bump version in pubspec.yaml"
            exit 1
          }

          echo "Creating tag $NEW_TAG"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${CURRENT_DATE}+${NEW_BUILD} [skip ci]"
          git push origin HEAD:main
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag_name=$NEW_TAG" >> "$GITHUB_OUTPUT"

  build_and_release:
    needs: auto_tag
    if: |
      always() &&
      (
        needs.auto_tag.result == 'success' ||
        (needs.auto_tag.result == 'skipped' && github.ref_type == 'tag')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto_tag.outputs.tag_name || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Pub get
        run: flutter pub get

      # Version scheme: tag (vYYYY.MM.DD-N) is the source of truth; pubspec.yaml
      # must already carry the matching version (bumped by auto_tag, or by
      # whoever pushed the tag directly) — validated below before building.
      - name: Compute version
        id: version
        run: |
          TAG_NAME="${{ needs.auto_tag.outputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v([0-9]{4}\.[0-9]{2}\.[0-9]{2})-([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG_NAME' does not match required format vYYYY.MM.DD-N"
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          BUILD_NUMBER="${BASH_REMATCH[2]}"

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate pubspec.yaml matches tag
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          EXPECTED_VERSION="${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}"
          if [ "$PUBSPEC_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) does not match tag ${{ steps.version.outputs.tag_name }} (expected $EXPECTED_VERSION)"
            exit 1
          fi
          echo "pubspec.yaml version matches tag: $PUBSPEC_VERSION"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Validate built APK matches tag
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          APK_VERSION_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          APK_VERSION_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")

          EXPECTED_VERSION_NAME="${{ steps.version.outputs.version_name }}"
          EXPECTED_VERSION_CODE="${{ steps.version.outputs.build_number }}"

          if [ "$APK_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ] || [ "$APK_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::Built APK reports $APK_VERSION_NAME ($APK_VERSION_CODE) but tag ${{ steps.version.outputs.tag_name }} expects $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
            exit 1
          fi
          echo "APK version validated: $APK_VERSION_NAME ($APK_VERSION_CODE)"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/latch-${{ steps.version.outputs.tag_name }}.apk"

      - name: Compute SHA-256
        id: sha
        run: |
          SHA256=$(sha256sum "dist/latch-${{ steps.version.outputs.tag_name }}.apk" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag_name }}" \
            "dist/latch-${{ steps.version.outputs.tag_name }}.apk" \
            --title "Latch ${{ steps.version.outputs.tag_name }}" \
            --generate-notes

      - name: Announce in Telegram
        run: |
          COMMIT_LINK="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.version.outputs.tag_name }}"
          CAPTION=$'🚀 Latch '"${{ steps.version.outputs.tag_name }}"$'\n\n🔖 Commit: '"${{ steps.version.outputs.short_sha }}"$'\n🔗 '"$COMMIT_LINK"$'\n📋 Release: '"$RELEASE_URL"$'\n🔐 SHA-256: '"${{ steps.sha.outputs.sha256 }}"

          curl -s -F "chat_id=-1003694191301" \
               -F "message_thread_id=54" \
               -F "document=@dist/latch-${{ steps.version.outputs.tag_name }}.apk" \
               -F "caption=$CAPTION" \
               "https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendDocument"
