name: Release

# Releases are deliberate, never a side effect of pushing to main:
#   - workflow_dispatch: pick a bump (patch/minor/major); auto_tag computes and
#     pushes the next vMAJOR.MINOR.PATCH-YYYY.MM.DD.BUILD tag, then builds it.
#   - pushing a tag directly (git push origin vX.Y.Z-YYYY.MM.DD.B): skips
#     auto_tag and builds that tag straight away.
# The tag is the single source of truth for the version; it is passed to
# `flutter build` via --build-name/--build-number, so nothing is ever committed
# back to main (no version-bump commit, no fast-forward races).
on:
  push:
    tags:
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type for the new tag'
        type: choice
        options: [patch, minor, major]
        default: patch

# Serializes runs per ref so two manual runs close together can't both read the
# same "latest tag" before either pushes its tag, which would race and compute
# the same build number twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only for manual runs: compute the next tag from existing tags (+ the chosen
  # bump) and push it. The tag is pushed with GITHUB_TOKEN, which by design does
  # NOT trigger another workflow run, so the build/release jobs below run once in
  # this same run rather than re-triggering via the tag-push event.
  auto_tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine and push next tag
        id: tag
        run: |
          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'

          git fetch --tags -q
          CURRENT_DATE="$(date -u +'%Y.%m.%d')"

          MATCHING_TAGS=$(git tag --list 'v*.*.*-*' | grep -E "$TAG_REGEX" || true)

          LATEST_BASE=$(echo "$MATCHING_TAGS" \
            | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/' \
            | sort -V | tail -1)

          LATEST_BUILD=$(echo "$MATCHING_TAGS" \
            | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.([0-9]+)$/\1/' \
            | sort -n | tail -1)

          if [ -z "$LATEST_BUILD" ]; then
            NEW_BUILD=1
          else
            NEW_BUILD=$((LATEST_BUILD + 1))
          fi

          if [ -z "$LATEST_BASE" ]; then
            MAJOR=1; MINOR=0; PATCH=0
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_BASE"
            BUMP="${{ github.event.inputs.bump || 'patch' }}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *) PATCH=$((PATCH + 1)) ;;
            esac
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}-${CURRENT_DATE}.${NEW_BUILD}"

          if ! [[ "$NEW_TAG" =~ $TAG_REGEX ]]; then
            echo "::error::Computed tag '$NEW_TAG' does not match required format vMAJOR.MINOR.PATCH-YYYY.MM.DD.BUILD"
            exit 1
          fi

          echo "Creating tag $NEW_TAG"
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag_name=$NEW_TAG" >> "$GITHUB_OUTPUT"

  # Resolve and validate the tag once, up front: both per-ABI build jobs and the
  # release job need the version parts, and re-deriving them per job would let
  # them drift. Pure string work on the tag — no checkout needed.
  version:
    needs: auto_tag
    if: |
      always() &&
      (
        (needs.auto_tag.result == 'success' && needs.auto_tag.outputs.tag_name != '') ||
        (needs.auto_tag.result == 'skipped' && github.ref_type == 'tag')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version_name: ${{ steps.version.outputs.version_name }}
      release_date: ${{ steps.version.outputs.release_date }}
      build_number: ${{ steps.version.outputs.build_number }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      abis: ${{ steps.abis.outputs.abis }}
    steps:
      # Single source of truth for which ABIs a release ships: it drives the
      # build matrix, the "are all APKs attached" check and the Telegram loop,
      # so an ABI can be added or dropped by editing this one line.
      #
      # TEMPORARILY DISABLED — armeabi-v7a (32-bit). Re-enable by putting this
      # entry back at the front of the list:
      #   {"abi":"armeabi-v7a","target_platform":"android-arm","abi_code":1}
      #
      # abi_code is the Play Store multi-APK ABI code; --split-per-abi offsets
      # each APK's versionCode by abi_code * 1000 (checked in the build job).
      - name: Resolve target ABIs
        id: abis
        run: |
          ABIS='[{"abi":"arm64-v8a","target_platform":"android-arm64","abi_code":2}]'
          echo "$ABIS" | jq -e 'length > 0' > /dev/null
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo "$ABIS" | jq -r '[.[].abi] | join(", ")')"

      # The tag (vMAJOR.MINOR.PATCH-YYYY.MM.DD.BUILD) is the source of truth for
      # the release version; the semver+build parts are fed to `flutter build`
      # in the build jobs. The date is release metadata only, not tracked in code.
      - name: Compute version
        id: version
        run: |
          TAG_NAME="${{ needs.auto_tag.outputs.tag_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]{4}\.[0-9]{2}\.[0-9]{2})\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG_NAME' does not match required format vMAJOR.MINOR.PATCH-YYYY.MM.DD.BUILD"
            exit 1
          fi
          VERSION_NAME="${BASH_REMATCH[1]}"
          RELEASE_DATE="${BASH_REMATCH[2]}"
          BUILD_NUMBER="${BASH_REMATCH[3]}"

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

  # The draft release is how the parallel build jobs hand their APKs to the
  # release job. Uploading them as workflow artifacts would be the obvious
  # route, but this repo is private, so artifacts bill against the account's
  # shared storage quota — which was full, failing the upload outright (and
  # usage is only recalculated every 6-12h, so it is not something a release
  # can wait on). Release assets don't touch that quota.
  #
  # Draft, not published: a release with no APKs attached is never visible, and
  # abort_cleanup deletes the draft if any later job fails. The release job
  # publishes it once both APKs are attached.
  draft_release:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Latch ${{ needs.version.outputs.tag_name }}" \
            --generate-notes

  # One job per ABI, in parallel. The per-ABI work — libsodium cross-compile,
  # gen_snapshot AOT, packaging — was ~60% of the old single-job build and
  # shares nothing between ABIs, so putting each chain on its own runner cuts
  # wall clock to roughly a one-ABI build. Each job attaches its own APK to the
  # draft release; nothing is published from here. The ABI set comes from the
  # version job — see "Resolve target ABIs" there.
  build:
    needs: [version, draft_release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      # No half-releases: if one ABI fails, cancel the others and skip release.
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.version.outputs.abis) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      # Without this, `flutter build apk` spends ~3 of its ~9 minutes on a cold
      # ~/.gradle: downloading the Gradle distribution, AGP/Kotlin plugins and
      # every Maven dependency before the first real task runs. Keyed on the
      # inputs that decide those downloads (wrapper version, Gradle scripts,
      # locked pub deps); restore-keys let an almost-matching cache still prime
      # most of it, including the other ABI's (the dependency set is identical).
      # ~/.gradle/caches also holds the Gradle build cache (build-cache-1), so
      # task outputs carry over between releases too. The ABI is part of the key
      # so the two concurrent jobs write separate caches instead of racing for
      # one name.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.abi }}-
            gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      # The tag is the source of truth: --build-name/--build-number set the
      # version directly, so pubspec.yaml is never mutated or committed back to
      # main. The APK-badging validation below still enforces the tag against
      # the built artifact.
      #
      # One real-device ABI per job, x86_64 dropped (emulator-only, never the
      # target of a direct APK install): a single fat APK bundling all three
      # ABIs' native libs (Flutter engine + AOT app code) ran ~54MB, over
      # Telegram's ~50MB bot upload limit. Per-ABI APKs come in at ~16-19MB
      # each — smaller individual downloads for users too.
      #
      # --split-per-abi stays even though only one platform is targeted: it is
      # what gives the output its ABI-suffixed name and the offset versionCode
      # the check below expects (verified: android-arm alone still yields
      # app-armeabi-v7a-release.apk with versionCode 1<build_number>).
      - name: Build release APK (${{ matrix.abi }})
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform ${{ matrix.target_platform }} \
            --build-name="${{ needs.version.outputs.version_name }}" \
            --build-number="${{ needs.version.outputs.build_number }}"

      - name: Validate built APK matches tag
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi

          EXPECTED_VERSION_NAME="${{ needs.version.outputs.version_name }}"
          BASE_VERSION_CODE="${{ needs.version.outputs.build_number }}"

          # flutter build --split-per-abi offsets the APK's versionCode by its
          # Play Store multi-APK ABI code (armeabi-v7a=1, arm64-v8a=2) times
          # 1000, so per-ABI APKs get distinct version codes.
          EXPECTED_VERSION_CODE=$((${{ matrix.abi_code }} * 1000 + BASE_VERSION_CODE))

          APK_PATH="build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          APK_VERSION_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          APK_VERSION_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")

          if [ "$APK_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ] || [ "$APK_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::${{ matrix.abi }} APK reports $APK_VERSION_NAME ($APK_VERSION_CODE) but tag ${{ needs.version.outputs.tag_name }} expects $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
            exit 1
          fi
          echo "${{ matrix.abi }} APK version validated: $APK_VERSION_NAME ($APK_VERSION_CODE)"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk" \
             "dist/latch-${{ needs.version.outputs.tag_name }}-${{ matrix.abi }}.apk"

      # --clobber so a re-run of a single matrix leg replaces its own asset
      # instead of failing on the one it uploaded last time.
      - name: Attach APK to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version.outputs.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "dist/latch-${{ needs.version.outputs.tag_name }}-${{ matrix.abi }}.apk"

  # Publishes once, after every ABI has attached its APK: flip the draft public,
  # then drop the same files in Telegram. Split out from the builds so this
  # happens exactly once no matter how many ABIs the matrix grows to.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only for the `git log` in "Gather release context" below; the APKs come
      # off the draft release, not from a build here.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag_name }}

      # Same bytes the build jobs attached — Telegram needs the files locally,
      # and re-downloading them proves the assets on the release are intact.
      - name: Download APKs from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ABIS: ${{ needs.version.outputs.abis }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.version.outputs.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' \
            --dir dist

          EXPECTED=$(echo "$ABIS" | jq length)
          COUNT=$(find dist -name '*.apk' | wc -l | tr -d ' ')
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED APKs on the release, found $COUNT"
            exit 1
          fi

      - name: Compute SHA-256
        id: sha
        run: |
          {
            echo "shas<<EOF"
            sha256sum dist/*.apk | awk '{print $2, $1}' | sed 's#dist/##'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.version.outputs.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

      # Gather human context so the APK dropped in Telegram is self-describing:
      # which change it carries (commit subject/author) and — if the release
      # commit came from a merged/squashed PR — that PR's number, title, branch
      # and link. A tag build has no branch of its own, so the PR head ref is
      # the closest "what was this" signal a tester can act on.
      - name: Gather release context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "commit_subject=$COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "commit_author=$COMMIT_AUTHOR" >> "$GITHUB_OUTPUT"

          # Full commit body (message minus subject) — multi-line, so emit it
          # via a heredoc delimiter and hand it to Announce through env rather
          # than expression substitution, so newlines/quotes can't break the
          # shell. (Never write an empty GitHub expression here — the parser
          # scans run: bodies too and rejects it.)
          {
            echo "commit_body<<COMMIT_BODY_EOF"
            git log -1 --pretty=%b
            echo "COMMIT_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          # Associated-PRs endpoint: the PR(s) whose merge/squash produced this
          # commit. Take the first; tolerate none (direct tag on a plain commit).
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // empty')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.[0].title // empty')
          PR_URL=$(echo "$PR_JSON" | jq -r '.[0].html_url // empty')
          PR_BRANCH=$(echo "$PR_JSON" | jq -r '.[0].head.ref // empty')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Announce in Telegram
        env:
          # Multi-line — passed via env so raw newlines/quotes stay data, not shell.
          COMMIT_BODY: ${{ steps.context.outputs.commit_body }}
          ABIS: ${{ needs.version.outputs.abis }}
        run: |
          COMMIT_LINK="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ needs.version.outputs.tag_name }}"
          COMMIT_SUBJECT="${{ steps.context.outputs.commit_subject }}"
          COMMIT_AUTHOR="${{ steps.context.outputs.commit_author }}"
          PR_NUMBER="${{ steps.context.outputs.pr_number }}"
          PR_TITLE="${{ steps.context.outputs.pr_title }}"
          PR_URL="${{ steps.context.outputs.pr_url }}"
          PR_BRANCH="${{ steps.context.outputs.pr_branch }}"

          # Keep the body from blowing past Telegram's 1024-char caption limit.
          BODY=$(printf '%s' "$COMMIT_BODY" | head -c 400)
          [ "${#COMMIT_BODY}" -gt 400 ] && BODY="${BODY}…"

          CAPTION=$'🚀 Latch '"${{ needs.version.outputs.tag_name }}"$' ('"${{ needs.version.outputs.release_date }}"$')'
          CAPTION+=$'\n📝 '"$COMMIT_SUBJECT"
          [ -n "$BODY" ] && CAPTION+=$'\n\n'"$BODY"
          if [ -n "$PR_NUMBER" ]; then
            CAPTION+=$'\n\n🔀 PR #'"$PR_NUMBER"$': '"$PR_TITLE"
            [ -n "$PR_BRANCH" ] && CAPTION+=$'\n🌿 Branch: '"$PR_BRANCH"
            [ -n "$PR_URL" ] && CAPTION+=$'\n🔗 '"$PR_URL"
          fi
          CAPTION+=$'\n\n🔖 Commit: '"${{ needs.version.outputs.short_sha }}"$' by '"$COMMIT_AUTHOR"
          CAPTION+=$'\n🔗 '"$COMMIT_LINK"
          CAPTION+=$'\n📋 Release: '"$RELEASE_URL"
          CAPTION+=$'\n\nSHA-256:\n'"${{ steps.sha.outputs.shas }}"

          # Reverse order so the biggest/most-installed ABI (arm64-v8a) is the
          # one carrying the full caption when several are shipped.
          for ABI in $(echo "$ABIS" | jq -r '[.[].abi] | reverse | .[]'); do
            APK="dist/latch-${{ needs.version.outputs.tag_name }}-${ABI}.apk"
            RESPONSE=$(curl -sS -F "chat_id=-1003694191301" \
                 -F "message_thread_id=54" \
                 -F "document=@${APK}" \
                 -F "caption=$CAPTION" \
                 "https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendDocument")
            echo "$RESPONSE"
            if ! echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "::error::Telegram sendDocument failed for $APK: $RESPONSE"
              exit 1
            fi
            # Only the first message needs the full caption; keep the rest terse.
            CAPTION="📦 $(basename "$APK")"
          done

  # A failed or cancelled build leaves a draft release behind, and — on a manual
  # dispatch — a tag that points at nothing published. Earlier failures had to be
  # cleaned up by hand (delete the tag, or the next dispatch silently skips that
  # version number), so do it here.
  #
  # The draft check is deliberate: if announce failed *after* publishing, the
  # release is real and must survive. The tag is only removed when auto_tag
  # created it in this run — a hand-pushed tag belongs to whoever pushed it.
  abort_cleanup:
    needs: [auto_tag, version, draft_release, build, release]
    if: |
      always() &&
      needs.version.outputs.tag_name != '' &&
      (
        needs.draft_release.result == 'failure' ||
        needs.build.result == 'failure' || needs.build.result == 'cancelled' ||
        needs.release.result == 'failure' || needs.release.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete draft release and auto-created tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          TAG_WAS_AUTOCREATED: ${{ needs.auto_tag.result == 'success' }}
        run: |
          IS_DRAFT=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null || echo "absent")

          if [ "$IS_DRAFT" = "true" ]; then
            if [ "$TAG_WAS_AUTOCREATED" = "true" ]; then
              echo "Deleting draft release $TAG_NAME and the tag auto_tag created for it"
              gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            else
              echo "Deleting draft release $TAG_NAME; leaving the hand-pushed tag alone"
              gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --yes
            fi
          elif [ "$IS_DRAFT" = "absent" ]; then
            echo "No release for $TAG_NAME; nothing to clean up"
            if [ "$TAG_WAS_AUTOCREATED" = "true" ]; then
              echo "Deleting the tag auto_tag created for the failed run"
              git push origin --delete "$TAG_NAME" || true
            fi
          else
            echo "$TAG_NAME is already published — leaving it in place"
          fi
