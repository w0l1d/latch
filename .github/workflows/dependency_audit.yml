name: Dependency Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Check outdated packages
        run: flutter pub outdated --no-color > outdated-raw.txt 2>&1 || true

      - name: Audit for known vulnerabilities
        run: dart pub audit > audit-raw.txt 2>&1 || true

      - name: Build summary
        id: summary
        run: |
          {
            echo "## Dependency Audit — $(date -u '+%Y-%m-%d')"
            echo
            echo "### Vulnerabilities (dart pub audit)"
            echo '```'
            cat audit-raw.txt
            echo '```'
            echo
            echo "### Outdated packages"
            echo '```'
            head -c 2000 outdated-raw.txt
            echo '```'
          } > summary.md

          if grep -qiE "found [1-9][0-9]* (known )?(security )?(vulnerabilit|advisor)" audit-raw.txt; then
            echo "status=issues" >> "$GITHUB_OUTPUT"
          else
            echo "status=clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: |
            summary.md
            outdated-raw.txt
            audit-raw.txt
          retention-days: 30

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ steps.summary.outputs.status }}"
          if [ "$STATUS" = "issues" ]; then EMOJI="⚠️"; else EMOJI="✅"; fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPORT=$(head -c 3500 summary.md)
          printf -v MESSAGE '%s *Latch — Dependency Audit*\n\n```\n%s\n```\n\n🔗 [Full report](%s)' \
            "$EMOJI" "$REPORT" "$RUN_URL"

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"-1003694191301\", \"message_thread_id\": 53, \"text\": $(echo "$MESSAGE" | jq -Rs .), \"parse_mode\": \"Markdown\", \"disable_web_page_preview\": true}" \
            "https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendMessage"
