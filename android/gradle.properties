org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# --split-per-abi gives Gradle two largely independent per-ABI task chains
# (libsodium cross-compile, gen_snapshot AOT, packaging); parallel lets them
# overlap instead of running back to back. caching stores task outputs under
# ~/.gradle/caches/build-cache-1, which CI restores between release runs.
# configuration-cache is deliberately NOT enabled — the Flutter Gradle plugin
# is not compatible with it.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
